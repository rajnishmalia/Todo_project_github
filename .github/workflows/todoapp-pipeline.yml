name: "Mera pehla action workflow"

on:
  pull_request: 
    branches:
      - main
  push: 
    branches: 
      - main

permissions:
  id-token: write
  contents: read
  
jobs:
  terraform-init-plan:
    name: terraform initwa
    environment: Dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
                
      - name: Install Terraform
        uses: little-core-labs/install-terraform@v2.0.0
        with:
          version: 1.13.0
                    
      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: 505f0b64-be59-417a-81f8-308900832b05
          tenant-id: 5b3b65b4-1fd5-4b53-a690-8f7e5568d890
          subscription-id: 4a56d5b3-94c0-47a0-ab55-850ee42f58bd
      
      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
        working-directory: ../Parent_module/Dev
  
      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: Parent_module/Dev
  
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ../Parent_module/Dev
      
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true
        working-directory: ../Parent_module/Dev
          
  
  terraform-apply:
    runs-on: ubuntu-latest
    if: github.ref == 'ref/heads/main'
    needs: terraform-init-plan
    environment: Dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Install Terraform
        uses: little-core-labs/install-terraform@v2.0.0
        with:
          version: 1.13.0
                       
      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: 505f0b64-be59-417a-81f8-308900832b05
          tenant-id: 5b3b65b4-1fd5-4b53-a690-8f7e5568d890
          subscription-id: 4a56d5b3-94c0-47a0-ab55-850ee42f58bd

      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: ../Parent_module/Dev
          
      - name: Terraform apply
        id: apply
        run: terraform apply --auto-approve
        continue-on-error: true
        working-directory: ../Parent_module/Dev
